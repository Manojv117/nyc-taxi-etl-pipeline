services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "ny_taxi"
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"
  
  
  taxi-ingest:
    image: taxi_ingest:v001
    build:
      context: .
      dockerfile: Dockerfile.ingest
    depends_on:
      - pgdatabase
    environment:
      DATABASE_URL: postgresql+psycopg://root:root@pgdatabase:5432/ny_taxi

  
volumes:
  ny_taxi_postgres_data:
    external: true
    name: 50233ab91074721ab999e58cce2274ea5739a12d2286953d9d082510e4026e3d

  pgadmin_data:
    external: true
    name: pgadmin_data
  

